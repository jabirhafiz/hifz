<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Illuminated Hearts — Hifz Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Coral + white palette. All colours below are shared design tokens. */
    --primary:#DA5A47;          /* app colour: buttons, active nav pill, hero cards */
    --primary-dark:#B8442F;     /* pressed / hover */
    --primary-darker:#8F2F1E;   /* dark coral text on light-coral backgrounds */
    --primary-tint:#FBE6E2;     /* light coral: highlighted cards, icon circles, badges */
    --primary-tint-2:#FDF2F0;
    --primary-text:#B8442F;     /* coral used as TEXT / links on white */
    --accent:#DA5A47;
    --white:#FFFFFF;
    --ink:#2B1B18;              /* primary text */
    --ink-soft:#735E59;         /* secondary text */
    --ink-faint:#8A7570;        /* inactive nav / hints */
    --border:#F0E2DF;
    --line-strong:#E8C9C3;
    --surface:#FFFFFF;
    --surface-alt:#FDF6F4;
    --page-bg:#FFFFFF;
    --hero:#DA5A47;             /* solid app colour for hero/active surfaces */
    --soft:#FDF0EE;             /* solid light coral for highlighted panels */
    --hero-soft:#C24A37;        /* solid darker coral for chips on coral */
    --on-hero:#FFFFFF;          /* text on coral */
    --success:#1E7F57;
    --success-bg:#E3F4EB;
    --success-border:#BFE4D0;
    --error:#B3261E;
    --error-bg:#FCEAEA;
    --error-border:#F1C6C6;
    --warn:#8A5A12;
    --warn-bg:#FDF1DC;
    --warn-border:#F2DBAE;
    --home:#5136B0;
    --home-bg:#ECE8FB;
    --neutral:#475569;
    --neutral-bg:#EEF1F6;
    --toast-bg:#2B1B18;
    --toast-fg:#FFFFFF;
    --overlay:rgba(43,27,24,0.45);
    --shadow: 0 1px 2px rgba(120,50,40,0.05), 0 8px 24px rgba(120,50,40,0.08);
    --radius-s:14px;
    --radius-m:20px;
    --radius-l:28px;
    --nav-h:68px;
    /* lift the bar above the iPhone home indicator: real safe-area inset, never less than 12px */
    --nav-pad:calc(env(safe-area-inset-bottom, 0px) + 14px);
    --nav-total:calc(var(--nav-h) + var(--nav-pad));
    --header-h:64px;
  }
  :root[data-theme="dark"]{
    /* Dark variant of the same coral palette */
    --primary:#E4705E;
    --primary-dark:#EE8C7C;
    --primary-darker:#FBD9D3;
    --primary-tint:#3B2420;
    --primary-tint-2:#2E1D1A;
    --primary-text:#F29A8A;
    --accent:#F29A8A;
    --ink:#FBEDEA;
    --ink-soft:#CBB3AD;
    --ink-faint:#A38C86;
    --border:#43302B;
    --line-strong:#5A423C;
    --surface:#261A17;
    --surface-alt:#2F211E;
    --page-bg:#1A1210;
    --hero:#C94E3B;
    --soft:#2E1D1A;
    --hero-soft:#A83E2D;
    --on-hero:#FFFFFF;
    --success:#6FD3A3;
    --success-bg:#12302A;
    --success-border:#1E5444;
    --error:#F29A9A;
    --error-bg:#3A1C26;
    --error-border:#5C2D3A;
    --warn:#EBBD6B;
    --warn-bg:#35290F;
    --warn-border:#54421A;
    --home:#BCAAF5;
    --home-bg:#2A2150;
    --neutral:#B5C0D6;
    --neutral-bg:#1B2742;
    --toast-bg:#FBEDEA;
    --toast-fg:#2B1B18;
    --overlay:rgba(0,0,0,0.6);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    background:var(--page-bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .num{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  a{color:inherit;}
  ::selection{background:var(--primary-tint);}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* HEADER */
  #header{
    position:sticky;top:0;z-index:20;
    background:var(--page-bg);
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px;
    display:flex;align-items:center;gap:12px;
    max-width:720px;margin:0 auto;width:100%;
  }
  .mark{
    width:46px;height:46px;flex:none;border-radius:50%;
    background:var(--hero);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
  }
  .mark svg{width:22px;height:22px;}
  .brand{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1;}
  .brand-name{font-weight:800;font-size:15.5px;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-sub{font-size:12px;color:var(--ink-soft);font-weight:500;}
  .header-date{font-size:12px;color:var(--primary-text);font-weight:600;text-align:right;white-space:nowrap;}

  .login-wrap{min-height:calc(100vh - 32px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 18px;background:var(--page-bg);border-radius:var(--radius-l);}
  .login-wrap .card{border:1px solid var(--soft);box-shadow:var(--shadow);}
  /* MAIN */
  #main-content{flex:1;padding:16px 16px calc(var(--nav-total) + 24px) 16px;max-width:720px;width:100%;margin:0 auto;}
  .section-title{font-size:22px;font-weight:800;margin:4px 0 14px 0;letter-spacing:-0.02em;}
  .section-title.small{font-size:15.5px;font-weight:700;margin-bottom:10px;}
  .subtle{color:var(--ink-soft);font-size:13px;}

  /* NAV: floating white pill; the active item is a navy pill with icon + label (as in the reference) */
  #bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    height:var(--nav-total);
    display:flex;align-items:flex-start;gap:2px;
    max-width:720px;margin:0 auto;width:100%;
    padding-bottom:var(--nav-pad);
    padding-left:calc(env(safe-area-inset-left, 0px) + 20px);padding-right:calc(env(safe-area-inset-right, 0px) + 20px);
    pointer-events:none;
  }
  #bottom-nav:empty{display:none;}
  #bottom-nav::before{
    content:'';position:absolute;left:12px;right:12px;top:0;bottom:var(--nav-pad);
    background:var(--surface);border-radius:34px;box-shadow:0 10px 30px rgba(120,50,40,0.16);
  }
  .nav-item{
    position:relative;pointer-events:auto;
    flex:1;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;
    background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:0 4px;
    height:calc(var(--nav-h) - 20px);margin-top:10px;border-radius:999px;min-width:0;
  }
  .nav-item svg{width:22px;height:22px;flex:none;}
  .nav-item span{display:none;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav-item.active{flex:2.6;background:var(--primary);color:var(--white);}
  .nav-item.active span{display:inline;}

  /* CARDS */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:16px;
    box-shadow:var(--shadow);
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:14px;
  }
  .stat-num{font-size:28px;font-weight:800;line-height:1;letter-spacing:-0.02em;}
  .stat-label{font-size:12px;color:var(--ink-soft);margin-top:7px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .stat-card.s-recited{--dot:var(--success);} .stat-card.s-notrecited{--dot:var(--error);} .stat-card.s-home{--dot:var(--home);}
  .stat-card.s-sick{--dot:var(--warn);} .stat-card.s-reported{--dot:var(--primary-text);} .stat-card.s-notreported{--dot:var(--neutral);}
  .stat-card.s-pending{--dot:var(--accent);}
  .split-card{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .split-half{min-width:0;padding:18px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:120px;border-radius:var(--radius-m);box-shadow:var(--shadow);}
  .split-half.left{background:var(--primary);border:2px solid var(--primary);color:var(--white);}
  .split-half.right{background:var(--primary);border:1px solid var(--primary-dark);color:var(--white);}
  .split-half .stat-label{margin-top:0;font-size:13px;}
  .split-half .stat-label::before{display:none;}
  .split-half.left .stat-label{color:var(--white);}
  .split-half.right .stat-label{color:var(--white);}
  .split-half .stat-num{font-size:40px;}
  .split-half.left .stat-num{color:var(--white);}
  .split-half.right .stat-num{color:var(--white);}
  .greet{margin:4px 0 14px 0;}
  .greet-hi{font-size:14px;font-weight:300;color:var(--ink-soft);line-height:1.3;}
  .greet-name{font-size:22px;font-weight:800;letter-spacing:-0.02em;line-height:1.2;}
  .greet-date{font-size:13px;font-weight:600;color:var(--ink-soft);margin:-6px 0 14px;}
  .today-hl{background:var(--soft);border:1px solid var(--primary);border-radius:10px;padding:8px 10px !important;}
  .today-tag{display:inline-block;background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;}
  .st-recited{color:var(--primary);font-weight:800;}
  .overview-panel{background:var(--soft);border-radius:var(--radius-m);padding:14px;margin-top:12px;}
  .overview-panel .ov-title{font-size:14px;font-weight:700;margin:2px 2px 10px;color:var(--ink);}
  .overview-panel .stat-card{border:none;box-shadow:0 1px 2px rgba(120,50,40,0.06);}

  .quick-actions-title{margin-top:18px;}
  .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:12px;box-shadow:var(--shadow);}
  .qa-btn{
    display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;min-height:64px;
    background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:12px 14px;text-align:left;cursor:pointer;color:var(--ink);
  }
  .qa-btn .qa-ic{width:40px;height:40px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;flex:none;}
  .qa-btn .qa-ic svg{width:20px;height:20px;color:var(--primary-text);}
  .qa-btn span{font-size:13.5px;font-weight:700;line-height:1.25;}
  .qa-btn.wide{grid-column:1/3;min-height:76px;}
  .qa-btn.wide .qa-ic{width:46px;height:46px;}
  .qa-btn.wide span{font-size:15.5px;}

  /* BUTTONS */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:16px;border:1px solid var(--primary);
    background:var(--primary);color:var(--white);font-weight:700;font-size:14px;
    padding:12px 18px;cursor:pointer;
  }
  .btn:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
  .btn.outline:hover{background:var(--primary-tint);color:var(--primary-darker);}
  .btn:active{background:var(--primary-dark);}
  .btn.outline{background:var(--surface);color:var(--primary-text);border:1px solid var(--line-strong);}
  .btn.outline:hover{border-color:var(--primary);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
  .btn.small{padding:8px 13px;font-size:12.5px;border-radius:14px;}
  .btn.block{width:100%;}
  .btn.danger{background:var(--surface);color:var(--error);border:1px solid var(--error-border);}
  .btn.danger:hover{background:var(--error-bg);color:var(--error);}
  .btn[disabled]{opacity:0.45;cursor:not-allowed;}
  .btn svg{width:15px;height:15px;flex:none;}

  /* FORM */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select, .field textarea{
    width:100%;box-sizing:border-box;padding:11px 14px;border-radius:var(--radius-s);border:1px solid var(--border);
    background:var(--surface-alt);color:var(--ink);font:inherit;font-size:14px;-webkit-appearance:none;appearance:none;margin:0;
  }
  .field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select{height:46px;line-height:1.2;}
  .field input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px var(--surface) inset;-webkit-text-fill-color:var(--ink);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary);}
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .seg{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;}
  .seg button{flex:1;padding:10px 4px;background:var(--surface);border:none;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--border);}
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--primary);color:var(--white);}
  .chip-select{display:flex;flex-wrap:wrap;gap:7px;}
  .chip-opt{padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .chip-opt.active{background:var(--primary);border-color:var(--primary);color:var(--white);}

  /* LISTS */
  .list{display:flex;flex-direction:column;gap:9px;}
  .row-card{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);
    padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);
  }
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--primary-tint);color:var(--primary-darker);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  .row-main{flex:1;min-width:0;}
  .row-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .row-end{text-align:right;flex:none;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;}
  .badge.stars{background:var(--primary-tint);color:var(--primary-darker);}
  .badge.tallies{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border);}
  .badge.done{background:var(--primary-tint);color:var(--primary-darker);}
  .badge.pending{background:var(--surface-alt);color:var(--ink-faint);border:1px solid var(--border);}
  .badge.inactive{background:var(--surface-alt);color:var(--ink-faint);}
  .badge.success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);}
  .badge.st-recited{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border);}
  .badge.st-notrecited{background:var(--error-bg);color:var(--error);border:1px solid var(--error-border);}
  .badge.st-home{background:var(--home-bg);color:var(--home);border:1px solid transparent;}
  .badge.st-sick{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);}
  .badge.st-reported{background:var(--primary-tint);color:var(--primary-text);border:1px solid var(--line-strong);}
  .badge.st-notreported{background:var(--neutral-bg);color:var(--neutral);border:1px dashed var(--ink-faint);}
  .banner.error{background:var(--error-bg);border-color:var(--error-border);color:var(--error);}
  .banner.success{background:var(--success-bg);border-color:var(--success-border);color:var(--success);}
  .icon-top-btn{background:var(--surface);border:none;color:var(--ink);cursor:pointer;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:var(--shadow);}
  .icon-top-btn svg{width:19px;height:19px;}
  .icon-top-btn:active{background:var(--surface-alt);}
  .header-icons{display:flex;align-items:center;gap:6px;flex:none;}
  .header-badge-dot{position:relative;}
  .header-badge-dot::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--error);border:1.5px solid var(--surface);}

  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-faint);}
  .search-wrap input{width:100%;padding:13px 14px 13px 40px;border-radius:999px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
  .filter-row select{padding:10px 14px;min-height:42px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);-webkit-text-fill-color:var(--ink);font-size:13px;font-weight:600;}

  .tab-row{display:flex;gap:6px;margin-bottom:16px;background:var(--surface);padding:5px;border-radius:999px;border:1px solid var(--border);box-shadow:var(--shadow);}
  .tab-row button{flex:1;border:none;background:transparent;padding:10px 4px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .tab-row button.active{background:var(--primary);color:var(--white);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{color:var(--ink-soft);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.02em;}
  .table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-m);}
  .table-scroll table{margin:0;}
  .table-scroll th:first-child, .table-scroll td:first-child{position:sticky;left:0;background:var(--surface);}

  .empty{text-align:center;padding:36px 12px;color:var(--ink-faint);}
  .empty svg{width:34px;height:34px;margin-bottom:10px;opacity:0.6;}
  .empty p{font-size:13px;margin:0;}

  .divider{height:1px;background:var(--border);margin:16px 0;}
  .stat-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat-mini{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px;text-align:center;}
  .stat-mini .n{font-size:18px;font-weight:700;}
  .stat-mini .l{font-size:10.5px;color:var(--ink-soft);margin-top:3px;line-height:1.2;}

  .fab{
    position:fixed;right:calc(50% - 360px + 16px);bottom:calc(var(--nav-total) + 18px);z-index:25;
    width:54px;height:54px;border-radius:50%;background:var(--primary);color:var(--white);
    border:none;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  @media (max-width:751px){ .fab{right:16px;} }
  .fab svg{width:22px;height:22px;}

  /* MODAL */
  #modal-root{position:fixed;inset:0;z-index:100;pointer-events:none;}
  .modal-overlay{
    position:absolute;inset:0;background:var(--overlay);
    display:flex;align-items:flex-end;justify-content:center;
    pointer-events:auto;
  }
  @media (min-width:560px){ .modal-overlay{align-items:center;} }
  .modal-sheet{
    background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    border-radius:28px 28px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px) 18px;
  }
  @media (min-width:560px){ .modal-sheet{border-radius:28px;max-height:82vh;} }
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:10px;}
  .modal-title{font-size:18px;font-weight:800;}
  .modal-title .sub{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:2px;}
  .modal-close{background:var(--surface-alt);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink-soft);}
  .modal-close svg{width:15px;height:15px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}

  .session-item{border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}

/* ============================= UTILITIES ============================= */
function todayStr(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
function currentMonthStr(){ return todayStr().slice(0,7); }
function currentYearStr(){ return todayStr().slice(0,4); }
function fmtDateDisplay(iso){
  if(!iso) return '—';
  const parts = iso.split('-');
  if(parts.length!==3) return iso;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return Number(parts[2])+' '+months[Number(parts[1])-1]+' '+parts[0];
}
function fmtMonthDisplay(ym){
  if(!ym) return '—';
  const parts = ym.split('-');
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return months[Number(parts[1])-1]+' '+parts[0];
}
function pageCount(from,to){
  const f=Number(from), t=Number(to);
  if(!isFinite(f) || !isFinite(t) || t<f || from==='' || to==='') return 0;
  return (t-f+1);
}
function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[1][0]).toUpperCase();
}
function byId(arr,id){ return arr.find(x=>x.id===id); }
function currentProgress(studentId){
  const s = byId(APP.students, studentId);
  const sess = APP.sessions.filter(function(x){
    return x.studentId===studentId && (x.type==='New Learn' || x.type==='New + Old') && x.juz!=='' && x.toPage!=='';
  }).slice().sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date? 1 : -1;
    return (Number(b.sessionNo)||0) - (Number(a.sessionNo)||0);
  });
  if(sess.length){
    return { juz: sess[0].juz, page: sess[0].toPage, fromSessions:true };
  }
  return { juz: s?s.currentJuz:'', page: s?s.currentPage:'', fromSessions:false };
}
function hifzCurrentDisplay(studentId){
  const s = byId(APP.students, studentId);
  if(!s) return { whole:'—', pages:0 };
  if(s.currentJuzWhole!==undefined && s.currentJuzWhole!==null && s.currentJuzWhole!==''){
    if(s.studyType!=='Doura'){
      // always derived from the latest valid New Learn sessions (never from a stale stored value / the starting page)
      const sb = s.progressBase;
      const base = { w:Number(s.currentJuzWhole)||1, p:Math.min(PAGES_PER_JUZ, Math.max(0, Number(s.currentJuzPages)||0)), at:0 };
      if(sb){ base.w = Number(sb.w)||1; base.p = Number(sb.p)||0; base.at = Number(sb.at)||0; base.manual = !!sb.manual; }
      const sess = APP.sessions.filter(function(x){ return x.studentId===studentId; });
      if(sess.some(newLearnValid)){ const r = computeHifzProgress(base, sess); return { whole:r.w, pages:r.p }; }

    return { whole:s.currentJuzWhole, pages:Number(s.currentJuzPages)||0 };
  }
  const legacy = currentProgress(studentId);
  return { whole: legacy.juz || s.currentJuz || '—', pages:0 };
}
// "pages" in storage = pages COMPLETED in the current Juz (0-20). The page shown to the user is the page being worked on (1-20).
function curPage(pages){ pages = Number(pages)||0; return pages>=PAGES_PER_JUZ ? PAGES_PER_JUZ : pages+1; }

function juzLabel(d){ const p = Number(d.pages)||0; return 'Juz '+d.whole + (p>0 ? ' - Pg '+p : ''); }

/* ============================= STATS ENGINE ============================= */
function computeStats(studentId, filterFn){
  filterFn = filterFn || function(){ return true; };
  const dr = APP.dailyRecords.filter(r=>r.studentId===studentId && filterFn(r.date));
  const points = dr.reduce((s,r)=> s + (Number(r.performance)||0), 0);
  const perfStars = Math.floor(points/30)*3;
  const ach = APP.achievements.filter(a=>a.studentId===studentId && filterFn(a.date));
  const achStars = ach.reduce((s,a)=> s + (Number(a.stars)||0), 0);
  const totalStars = perfStars + achStars;
  const tal = APP.tallies.filter(t=>t.studentId===studentId && filterFn(t.date));
  const talliesGiven = tal.reduce((s,t)=> s + (Number(t.count)||0), 0);
  const starsUsed = Math.min(totalStars, Math.floor(talliesGiven/2));
  const talliesCancelled = starsUsed*2;
  const starsRemaining = totalStars - starsUsed;
  const talliesRemaining = Math.max(0, talliesGiven - talliesCancelled);

  const sess = APP.sessions.filter(s=>s.studentId===studentId && filterFn(s.date));
  let newLearnPages=0, oldRevisionPages=0, lastLearnPages=0, totalPages=0;
  sess.forEach(s=>{
    const pc = pageCount(s.fromPage, s.toPage);
    totalPages += pc;
    // Last Learn ('New + Old' internally) is its own session type: never counted as New Learn or Old Revision.
    if(s.type==='New Learn') newLearnPages += pc;
    else if(s.type==='Old Learn / Revision') oldRevisionPages += pc;
    else if(s.type==='New + Old') lastLearnPages += pc;
  });

  const statusCounts = {};
  STATUS_OPTIONS.forEach(s=>{ statusCounts[s]=0; });
  dr.forEach(r=>{ const ns = normStatus(r.status); if(statusCounts[ns]!==undefined) statusCounts[ns]++; });

  return {
    points, perfStars, achStars, totalStars, starsUsed, starsRemaining,
    talliesGiven, talliesCancelled, talliesRemaining,
    newLearnPages, oldRevisionPages, lastLearnPages, totalPages, sessionsCount: sess.length,
    statusCounts, dailyRecordsCount: dr.length, achievementsCount: ach.length, talliesCount: tal.length
  };
}
function competitionColumns(type){ return type==='Qirath' ? QIRATH_COMP_COLUMNS : HIFZ_COMP_COLUMNS; }
function computeCompetitionResults(comp){
  const list = (comp.competitorIds||[]).map(function(sid){
    const m = (comp.marks && comp.marks[sid]) || {};
    const m1 = Number(m.m1)||0, m2 = Number(m.m2)||0, m3 = Number(m.m3)||0;
    return { studentId:sid, m1:m1, m2:m2, m3:m3, total:m1+m2+m3, hasMarks: !!(comp.marks && comp.marks[sid]) };
  });
  list.sort(function(a,b){ return b.total-a.total; });
  list.forEach(function(r,idx){ r.rank = idx+1; });
  return list;
}
function studentCompetitionHistory(studentId, filterFn){

    return { competition:c, result:mine, stars:stars };
  }).sort(function(a,b){ return a.competition.date<b.competition.date?1:-1; });
}

/* ============================= DB LAYER (with in-memory fallback) ============================= */
function makeMemoryDb(){
  const store = {};
  const listenerMap = {};
  const docListenerMap = {};
  let counter = 0;
  function ensure(name){ if(!store[name]) store[name]={}; return store[name]; }
  function ensureListeners(name){ if(!listenerMap[name]) listenerMap[name]=[]; return listenerMap[name]; }
  function col(name){
    const data = ensure(name);
    function notify(){
      const listeners = ensureListeners(name);
      const docs = Object.keys(data).map(id=>({ id, exists:true, data:()=>data[id] }));
      listeners.slice().forEach(fn=>{ try{ fn({docs:docs}); }catch(e){} });
    }
    return {
      doc(id){
        if(!id){ id = 'm'+(++counter); }
        const dlKey = name+'/'+id;
        if(!docListenerMap[dlKey]) docListenerMap[dlKey] = [];
        function notifyDoc(){
          const docListeners = docListenerMap[dlKey];
          const snap = { id:id, exists: !!data[id], data:()=>data[id] };
          docListeners.slice().forEach(function(fn){ try{ fn(snap); }catch(e){} });
        }
        return {
          id: id,
          async get(){ return { id:id, exists: !!data[id], data:()=>data[id] }; },
          async set(d){ data[id] = Object.assign({}, d); notify(); notifyDoc(); },
          async update(d){ data[id] = Object.assign({}, data[id]||{}, d); notify(); notifyDoc(); },
          async delete(){ delete data[id]; notify(); notifyDoc(); },
          onSnapshot(next){
            docListenerMap[dlKey].push(next);
            setTimeout(notifyDoc, 0);
            return function(){ docListenerMap[dlKey] = docListenerMap[dlKey].filter(function(f){ return f!==next; }); };
          }
        };
      },
      async add(d){
        const id = 'm'+(++counter);
        data[id] = Object.assign({}, d);
        notify();
        return { id: id };
      },
      onSnapshot(next){
        const listeners = ensureListeners(name);
        listeners.push(next);
        notify();
        return function(){
          const arr = ensureListeners(name);
          const i = arr.indexOf(next);
          if(i!==-1) arr.splice(i,1);
        };
      }
    };
  }
  return { collection: col, isMemory:true };
}

function dbc(name){ return APP.db.collection(name); }

/* ===== SUPABASE CONFIG ===== */
const SUPABASE_URL = 'https://tmegfwtyninsjnfmugza.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Tbh9s5K7T4IR0ncPlm0KCg_rmccReAU';

function makeSupabaseDb(sbClient){
  const pollingIntervals = {};
  const POLL_MS = 3000;

  function col(tableName){
    const docListeners = {};
    const colListeners = [];

    async function fetchAll(){
      const { data, error } = await sbClient.from(tableName).select('*');
      if(error){ console.error('supabase fetchAll', tableName, error); return []; }
      return (data||[]).map(function(row){
        const d = Object.assign({}, row);
        const id = d.id; delete d.id;
        return { id: id, exists:true, data:function(){ return d; } };
      });
    }

    async function fetchDoc(id){
      const { data, error } = await sbClient.from(tableName).select('*').eq('id', id).maybeSingle();
      if(error){ console.error('supabase fetchDoc', tableName, id, error); return { id:id, exists:false, data:function(){ return undefined; } }; }
      if(!data) return { id:id, exists:false, data:function(){ return undefined; } };
      const d = Object.assign({}, data); delete d.id;
      return { id:id, exists:true, data:function(){ return d; } };
    }

    function startColPolling(){
      if(pollingIntervals[tableName]) return;
      pollingIntervals[tableName] = setInterval(async function(){
        if(!colListeners.length) return;
        const docs = await fetchAll();
        colListeners.slice().forEach(function(fn){ try{ fn({docs:docs}); }catch(e){} });
      }, POLL_MS);
    }

    function startDocPolling(id){
      const key = tableName+'/'+id;
      if(pollingIntervals[key]) return;
      pollingIntervals[key] = setInterval(async function(){
        if(!(docListeners[id]&&docListeners[id].length)) return;
        const snap = await fetchDoc(id);
        (docListeners[id]||[]).slice().forEach(function(fn){ try{ fn(snap); }catch(e){} });
      }, POLL_MS);
    }

    async function notifyAll(){
      const docs = await fetchAll();
      colListeners.slice().forEach(function(fn){ try{ fn({docs:docs}); }catch(e){} });
    }

    async function notifyDoc(id){
      const snap = await fetchDoc(id);
      (docListeners[id]||[]).slice().forEach(function(fn){ try{ fn(snap); }catch(e){} });
    }

    function doc(id){
      if(!id){ id = 'auto_'+Date.now()+'_'+Math.random().toString(36).slice(2); }
      if(!docListeners[id]) docListeners[id] = [];
      return {
        id: id,
        async get(){ return await fetchDoc(id); },
        async set(d){
          const row = Object.assign({ id:id }, d);
          const { error } = await sbClient.from(tableName).upsert(row, { onConflict:'id' });
          if(error) console.error('supabase set', tableName, id, error);
          await notifyAll(); await notifyDoc(id);
        },
        async update(d){
          const { error } = await sbClient.from(tableName).update(d).eq('id', id);
          if(error){ console.error('supabase update', tableName, id, error); return; }
          await notifyAll(); await notifyDoc(id);
        },
        async delete(){
          const { error } = await sbClient.from(tableName).delete().eq('id', id);
          if(error) console.error('supabase delete', tableName, id, error);
          await notifyAll(); await notifyDoc(id);
        },
        onSnapshot(fn){
          docListeners[id].push(fn);
          fetchDoc(id).then(function(snap){ try{ fn(snap); }catch(e){} });
          startDocPolling(id);
          return function(){ docListeners[id] = (docListeners[id]||[]).filter(function(f){ return f!==fn; }); };
        }
      };
    }

    return {
      doc: doc,
      async add(d){
        const id = 'r'+Date.now()+'_'+Math.random().toString(36).slice(2);
        const row = Object.assign({ id:id }, d);
        const { error } = await sbClient.from(tableName).insert(row);
        if(error) console.error('supabase add', tableName, error);
        await notifyAll();
        return { id: id };
      },
      onSnapshot(fn){
        colListeners.push(fn);
        fetchAll().then(function(docs){ try{ fn({docs:docs}); }catch(e){} });
        startColPolling();
        return function(){ const i=colListeners.indexOf(fn); if(i!==-1) colListeners.splice(i,1); };
      }
    };
  }

  return { collection: col, isSupabase: true };
}

/* ---- Password hashing (PBKDF2-SHA256 via Web Crypto; plaintext is never stored) ---- */
const PBKDF2_ITER = 120000;
const MIN_STAFF_PW = 4, MIN_PARENT_PW = 4;
function b64enc(buf){ let bin=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i++) bin+=String.fromCharCode(u[i]); return btoa(bin); }
function b64dec(str){ const bin=atob(str); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function hashPassword(pw, saltB64, iter){
  const c = (typeof crypto!=='undefined') ? crypto : null;
  if(!c || !c.subtle) throw new Error('Secure hashing is not available in this browser');
  const salt = saltB64 ? b64dec(saltB64) : c.getRandomValues(new Uint8Array(16));
  const it = iter || PBKDF2_ITER;
  const key = await c.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
  const bits = await c.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:it, hash:'SHA-256'}, key, 256);
  return { hash:b64enc(bits), salt:b64enc(salt), iter:it };
}
async function verifyPassword(pw, rec){
  if(!rec || !rec.hash || !rec.salt) return false;
  const r = await hashPassword(pw, rec.salt, rec.iter);
  if(r.hash.length!==rec.hash.length) return false;
  let diff=0; for(let i=0;i<r.hash.length;i++) diff |= r.hash.charCodeAt(i)^rec.hash.charCodeAt(i);
  return diff===0;
}
function credFp(rec){ return rec && rec.hash ? rec.hash.slice(0,12) : (rec && rec.password ? 'legacy' : ''); }

/* ---- Login ---- */
const LOGIN_LOCK = { fails:0, until:0 };
async function attemptLogin(){
  if(APP.loginBusy) return;
  const uEl = document.getElementById('login-user');
  const pEl = document.getElementById('login-pass');
  const u = uEl ? uEl.value.trim() : '';
  const p = pEl ? pEl.value : '';
  if(!u || !p){ APP.loginError='Enter both username and password.'; render(); return; }
  if(Date.now() < LOGIN_LOCK.until){
    APP.loginError='Too many attempts. Please wait '+Math.ceil((LOGIN_LOCK.until-Date.now())/1000)+'s and try again.'; render(); return;
  }
  const admin = APP.adminSettings;
  if(!admin){ APP.loginError='Still loading — please try again in a moment.'; render(); return; }
  APP.loginBusy = true;
  try{
    let auth = null, disabled = false;
    // 1) Administrator
    if(u===admin.username){
      let ok = false;
      if(admin.hash){ ok = await verifyPassword(p, admin); }
      else if(admin.password && admin.password===p){
        ok = true; // legacy plaintext record → upgrade to a salted hash right now
        const h = await hashPassword(p);
        const upgraded = { username:admin.username, hash:h.hash, salt:h.salt, iter:h.iter, isDefault:(p==='thilawa'), updatedAt:Date.now() };
        APP.adminSettings = upgraded;
        await dbc('settings').doc('admin').set(upgraded);
      }
      if(ok) auth = { role:'admin', username:admin.username, fp:credFp(APP.adminSettings) };
    }
    // 2) Teachers
    if(!auth){
      const t = APP.users.find(function(x){ return x.role==='teacher' && x.username===u; });
      if(t && await verifyPassword(p, t)){
        if(t.active===false) disabled = true;
        else auth = { role:'teacher', userId:t.id, username:t.username, name:t.name, fp:credFp(t) };
      }
    }
    // 3) Parents / students
    if(!auth && !disabled){
      const st = APP.students.find(function(x){ return x.loginUsername && x.loginUsername===u; });
      if(st){
        let ok=false;
        if(st.loginHash){ ok = await verifyPassword(p, {hash:st.loginHash, salt:st.loginSalt, iter:st.loginIter}); }
        else if(st.loginPassword && st.loginPassword===p){
          ok = true;
          const h = await hashPassword(p);
          await dbc('students').doc(st.id).update({ loginHash:h.hash, loginSalt:h.salt, loginIter:h.iter, loginPassword:'' });
        }
        if(ok){
          const cur = byId(APP.students, st.id) || st;
          auth = { role:'parent', studentId:st.id, username:u, fp:cur.loginHash ? cur.loginHash.slice(0,12) : 'legacy' };
        }
      }
    }
    if(auth){
      LOGIN_LOCK.fails = 0;
      APP.auth = auth; APP.loginError = '';
      saveAuthToStorage(auth);
      if(auth.role==='parent') APP.pView = 'p-dashboard'; else APP.view = 'dashboard';
    } else if(disabled){
      APP.loginError = 'This account has been disabled. Please contact the administrator.';
    } else {
      LOGIN_LOCK.fails++;
      if(LOGIN_LOCK.fails>=5){ LOGIN_LOCK.until = Date.now()+30000; LOGIN_LOCK.fails = 0; }
      APP.loginError = 'Incorrect username or password.';
    }
  }catch(e){
    APP.loginError = 'Sign-in is unavailable right now: '+(e && e.message ? e.message : 'unknown error');
  }
  APP.loginBusy = false;
  render();
}
function logout(){
  APP.auth = null; APP.pendingAuth = null;
  clearAuthStorage();
  APP.view = 'dashboard';
  render();
}
function currentFpFor(a){
  if(a.role==='admin') return APP.adminSettings ? credFp(APP.adminSettings) : null;
  if(a.role==='teacher'){ const u=byId(APP.users, a.userId); return u && u.active!==false ? credFp(u) : ''; }
  if(a.role==='parent'){ const s=byId(APP.students, a.studentId); return s && s.loginUsername===a.username ? (s.loginHash ? s.loginHash.slice(0,12) : (s.loginPassword?'legacy':'')) : ''; }
  return '';
}
function authSourcesReady(a){
  if(a.role==='admin') return APP.adminSettings!==null;
  if(a.role==='teacher') return USERS_LOADED_ONCE;
  return STUDENTS_LOADED_ONCE;
}
function validateStoredAuth(){
  // A session restored from the browser is only trusted once it matches the live credential record.
  if(!APP.auth && APP.pendingAuth){
    const a = APP.pendingAuth;
    if(!authSourcesReady(a)) return;
    const fp = currentFpFor(a);
    if(a.fp && fp && fp===a.fp){ APP.auth = a; if(a.role==='parent') APP.pView='p-dashboard'; }
    else clearAuthStorage();
    APP.pendingAuth = null;
    return;
  }
  if(!APP.auth) return;
  const a = APP.auth;
  if(!authSourcesReady(a)) return;
  if(a.role==='parent' && STUDENTS_LOADED_ONCE){
    const st = byId(APP.students, a.studentId);
    if(!st || st.loginUsername!==a.username){ APP.auth=null; clearAuthStorage(); }
  } else if(a.role==='teacher'){
    const u = byId(APP.users, a.userId);
    if(!u || u.active===false || u.role!=='teacher'){ APP.auth=null; clearAuthStorage(); }
    else if(a.fp && credFp(u)!==a.fp){ APP.auth=null; clearAuthStorage(); }
  } else if(a.role==='admin' && a.fp && APP.adminSettings && credFp(APP.adminSettings)!==a.fp){
    APP.auth=null; clearAuthStorage();
  }
}

/* ============================= MIGRATION (safe to run repeatedly) ============================= */
// Merges the old separate Current Juz / Progress Juz values into one Current Juz and enforces the 20-page limit.
// Only writes when a student actually needs a fix, so re-running it changes nothing. Out-of-range values are
// kept in legacyJuzPages (and shown on the profile) instead of being discarded.
let MIGRATION_RUNNING = false, MIGRATION_DONE = false;
async function migrateJuzData(){
  if(!isAdmin() || MIGRATION_RUNNING) return 0;
  MIGRATION_RUNNING = true;
  let changed = 0;
  try{
    const list = APP.students.slice();
    for(let i=0;i<list.length;i++){
      const st = list[i];
      const upd = {};
      const whole = st.currentJuzWhole;
      if(whole===undefined || whole===null || whole==='' || !Number.isFinite(Number(whole))){
        const start = Number(st.currentJuz);
        upd.currentJuzWhole = (Number.isInteger(start) && start>=1 && start<=MAX_JUZ) ? start : 1;
        if(st.currentJuzPages===undefined || st.currentJuzPages==='') upd.currentJuzPages = 0;
      } else if(Number(whole)>MAX_JUZ){ upd.legacyJuzValue = Number(whole); upd.currentJuzWhole = MAX_JUZ; }
      else if(Number(whole)<1){ upd.currentJuzWhole = 1; }
      ['currentJuzPages','douraJuzPages'].forEach(function(k){
        const v = Number(st[k]);
        if(Number.isFinite(v) && v>PAGES_PER_JUZ){ upd[k]=PAGES_PER_JUZ; if(!st.legacyJuzPages) upd.legacyJuzPages = v; }
        else if(Number.isFinite(v) && v<0){ upd[k]=0; }
        else if(st[k]!==undefined && st[k]!=='' && !Number.isInteger(v) && Number.isFinite(v)){ upd[k]=Math.floor(v); }
      });
      if(Object.keys(upd).length){ await dbc('students').doc(st.id).update(upd); changed++; }
    }
    MIGRATION_DONE = true;
  } finally { MIGRATION_RUNNING = false; }
  return changed;
}
let STATUS_MIG_DONE = false, STATUS_MIG_RUNNING = false;
// Renames stored 'Out Program' -> 'Reported' (daily records + leave requests). The original text is kept in legacyStatus.
async function migrateStatusLabels(){
  if(!isAdmin() || STATUS_MIG_RUNNING) return 0;
  STATUS_MIG_RUNNING = true; let n = 0;
  try{
    const recs = APP.dailyRecords.filter(function(r){ return LEGACY_STATUS[r.status]; });
    for(let i=0;i<recs.length;i++){ await dbc('dailyRecords').doc(recs[i].id).update({ status:normStatus(recs[i].status), legacyStatus:recs[i].status }); n++; }
    const reqs = APP.requests.filter(function(r){ return LEGACY_STATUS[r.reason]; });
    for(let i=0;i<reqs.length;i++){ await dbc('requests').doc(reqs[i].id).update({ reason:normStatus(reqs[i].reason), legacyReason:reqs[i].reason }); n++; }
    STATUS_MIG_DONE = true;
  } finally { STATUS_MIG_RUNNING = false; }
  return n;
}
function maybeRunMigrations(){
  if(!STATUS_MIG_DONE && !STATUS_MIG_RUNNING && isAdmin() && LOADED.dailyRecords && LOADED.requests){
    migrateStatusLabels().catch(function(e){ console.error('status migration failed', e); STATUS_MIG_DONE = true; });
  }
  if(MIGRATION_DONE || MIGRATION_RUNNING || !isAdmin() || !STUDENTS_LOADED_ONCE) return;
  migrateJuzData().catch(function(e){ console.error('migration failed', e); MIGRATION_DONE = true; });
}

function validateStudentProgress(data){
  [['currentJuzWhole',1,MAX_JUZ,'Current Juz'],['douraJuzWhole',1,MAX_JUZ,'Current Juz']].forEach(function(r){
    if(data[r[0]]!==undefined && data[r[0]]!==''){ const n=Number(data[r[0]]); if(!Number.isInteger(n)||n<r[1]||n>r[2]) throw new Error(r[3]+' must be between '+r[1]+' and '+r[2]); }
  });
  ['currentJuzPages','douraJuzPages'].forEach(function(k){

  });
}
function validateSessionData(d){

  ['fromPage','toPage'].forEach(function(k){

  });

/* ---- Page-based Juz progression ----
   Every Juz has 20 pages. A Juz completes only when page 20 is recited AND confirmed (session result "Clear").
   Page 20 with "Restart Required" stays on page 20 (awaiting confirmation) and does not advance. */
const JUZ_LOCKS = {};
function progressKeys(s){ return s.studyType==='Doura' ? {w:'douraJuzWhole', p:'douraJuzPages'} : {w:'currentJuzWhole', p:'currentJuzPages'}; }
async function completeJuzIfReady(studentId){
  const s = byId(APP.students, studentId);
  if(!s) return false;
  const isDoura = s.studyType==='Doura';
  const k = progressKeys(s);
  const juz = Number(s[k.w]) || (isDoura ? 1 : (Number(s.currentJuz)||1));
  const pages = Number(s[k.p])||0;
  if(pages < PAGES_PER_JUZ) return false;
  if(!isDoura && s.hifzCompleted && juz>=MAX_JUZ) return false;
  const lockKey = studentId+':'+(isDoura?'D':'H')+':'+juz;
  if(JUZ_LOCKS[lockKey]) return false;                       // duplicate submit while the first is in flight
  if(s.lastJuzAdvanceFrom===juz && s.lastJuzAdvanceKind===(isDoura?'D':'H') && Date.now()-(s.lastJuzAdvanceAt||0) < 4000) return false;
  JUZ_LOCKS[lockKey] = true;
  try{
    const completedDouras = Number(s.completedDouras)||0;
    await dbc('juzCompletions').doc(studentId+'_'+(isDoura?'D'+completedDouras:'H')+'_'+juz).set({
      studentId:studentId, kind:isDoura?'Doura':'Hifz', juz:juz, cycle:isDoura?completedDouras:0, completedAt:Date.now()
    });
    const stamp = { lastJuzAdvanceAt:Date.now(), lastJuzAdvanceFrom:juz, lastJuzAdvanceKind:isDoura?'D':'H' };
    if(juz < MAX_JUZ){
      const upd = {}; upd[k.w] = juz+1; upd[k.p] = 0;
      await updateStudent(studentId, Object.assign(upd, stamp));
      toast('Juz '+juz+' completed — now Juz '+(juz+1)+', Page 1');
    } else if(isDoura){
      await updateStudent(studentId, Object.assign({ douraJuzWhole:1, douraJuzPages:0, completedDouras:completedDouras+1 }, stamp));
      toast('Doura '+(completedDouras+1)+' completed — starting next Doura from Juz 1');
    } else {
      await updateStudent(studentId, Object.assign({ hifzCompleted:true, hifzCompletedAt:Date.now() }, stamp));
      toast('Juz 30 completed — Hifz complete');
    }
    return true;
  } finally { delete JUZ_LOCKS[lockKey]; }
}
// deltaPages: change in pages completed; completion: {page20Clear:true} when the session ends on page 20 with result Clear for the student's current Juz
async function adjustJuzProgress(studentId, deltaPages, sessionType, completion){
  const s = byId(APP.students, studentId);
  if(!s) return;
  const isDoura = s.studyType==='Doura';
  if(!isDoura && !(sessionType==='New Learn' || sessionType==='New + Old')) return;
  const k = progressKeys(s);
  const cur = Number(s[k.p])||0;
  let pages = Math.max(0, Math.min(PAGES_PER_JUZ, cur + (deltaPages||0)));
  const confirmed = !!(completion && completion.page20Clear);
  if(confirmed && completion.juz!=='' && completion.juz!==undefined && completion.juz!==null){
    const curJuz = Number(s[k.w]) || (isDoura ? 1 : (Number(s.currentJuz)||1));
    if(Number(completion.juz)!==curJuz) return await (pages!==cur ? updateStudent(studentId,(function(){var o={};o[k.p]=pages;return o;})()) : null);
  }
  if(confirmed) pages = PAGES_PER_JUZ;                        // page 20 was actually completed
  if(pages!==cur){ const o={}; o[k.p]=pages; await updateStudent(studentId, o); }
  if(confirmed) await completeJuzIfReady(studentId);
}

/* ---- Hifz Current Juz: derived (never accumulated) from a base position + the student's New Learn sessions ----
   - Only valid 'New Learn' sessions move Current Juz. Last Learn ('New + Old') and Old Revision never do.
   - The Juz and 'To page' of the latest New Learn session set the position (Juz 5, pages 15-17 => Juz 5 - Page 17).
   - Page 20 completes the Juz only when that saved session's result is "Clear"; the next Juz is then shown without a page.
     After Juz 30 the sequence goes back to Juz 1 (there is never a Juz 31).
   - A skipped page range, a jump of more than one Juz, or a session for an earlier Juz is never silently accepted as normal:
     the student is flagged for review (a backwards session is ignored for progress).
   - Everything is recomputed from the sessions every time, so editing or deleting a session can't double count. */
function newLearnValid(x){
  const f=Number(x.fromPage), t=Number(x.toPage), j=Number(x.juz);
  return x.type==='New Learn' && Number.isInteger(j) && j>=1 && j<=MAX_JUZ && Number.isInteger(f) && Number.isInteger(t) && f>=1 && t<=PAGES_PER_JUZ && t>=f;
}
function nextJuzNo(j){ return j>=MAX_JUZ ? 1 : j+1; }
function computeHifzProgress(base, sessions){
  let W = base.w, P = base.p; const completed = [], seen = {}, flags = [];
  const list = sessions.filter(function(x){ return newLearnValid(x) && (!base.manual || (Number(x.createdAt)||0) >= (base.at||0)); })
    .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)) || (Number(a.sessionNo)||0)-(Number(b.sessionNo)||0) || (Number(a.createdAt)||0)-(Number(b.createdAt)||0); });
  let n = 0;
  list.forEach(function(x){
    const J = Number(x.juz), f = Number(x.fromPage), t = Number(x.toPage);
    const key = [x.date, J, f, t].join('|');
    if(seen[key]) return; seen[key] = true;                       // identical session saved twice counts once
    // the latest New Learn session decides: Current Juz = its Juz, Current Page = its "To page"
    if(J !== W){
      const ahead = (J - W + MAX_JUZ) % MAX_JUZ;
      if(n>0 && ahead>1) flags.push('Juz '+J+' was entered on '+x.date+' without a session for the Juz before it.');
      W = J; P = 0;
    }
    if(n>0 && f > P+1) flags.push('Pages '+(P+1)+'–'+(f-1)+' of Juz '+W+' have no New Learn session (session on '+x.date+').');
    n++;
    P = t;
    if(P >= PAGES_PER_JUZ && x.result==='Clear'){ completed.push(W); W = nextJuzNo(W); P = 0; }
  });
  return { w:W, p:P, finished:false, completed:completed, flags:flags };
}
async function ensureProgressBase(studentId){
  const s = byId(APP.students, studentId);
  if(s.progressBase) return s.progressBase;
  // starting point used only when the student has no valid New Learn session; saved sessions always decide the position
  const base = { w: Number(s.currentJuzWhole)||Number(s.currentJuz)||1, p: Math.min(PAGES_PER_JUZ, Math.max(0, Number(s.currentJuzPages)||0)), at: 0 };
  await updateStudent(studentId, { progressBase: base });
  s.progressBase = base;
  return base;
}
async function recomputeHifzProgress(studentId, ov){
  const s = byId(APP.students, studentId);
  if(!s || s.studyType==='Doura') return;
  const base = await ensureProgressBase(studentId);
  const list = APP.sessions.filter(function(x){ return x.studentId===studentId && !(ov && ov.id===x.id); });
  if(ov && ov.data) list.push(Object.assign({ id:ov.id, studentId:studentId }, ov.data));
  const r = computeHifzProgress(base, list);
  const curW = Number(s.currentJuzWhole)||1, curP = Number(s.currentJuzPages)||0;
  // completion history follows the sessions: add missing, drop ones that are no longer earned
  for(let i=0;i<r.completed.length;i++){
    const j = r.completed[i], id = studentId+'_H_'+j;
    if(!APP.juzCompletions.some(function(c){ return c.id===id; })){
      await dbc('juzCompletions').doc(id).set({ studentId:studentId, kind:'Hifz', juz:j, cycle:0, completedAt:Date.now() });
    }
  }
  const stale = APP.juzCompletions.filter(function(c){ return c.studentId===studentId && c.kind==='Hifz' && Number(c.juz)>=base.w && r.completed.indexOf(Number(c.juz))===-1 && (Number(c.juz)>=r.w); });
  for(let i=0;i<stale.length;i++){ await dbc('juzCompletions').doc(stale[i].id).delete(); }
  if(r.w!==curW || r.p!==curP || s.hifzCompleted){
    const upd = { currentJuzWhole:r.w, currentJuzPages:r.p, hifzCompleted:false };
    await updateStudent(studentId, upd);
    if(r.w!==curW && r.p===0) toast('Juz '+curW+' completed — now Juz '+r.w);
  }
  // conflicts / skipped pages are flagged for review, never guessed
  const note = r.flags.length ? r.flags[0] : '';
  if(note){ if(s.progressNoteAck!==note && (!s.progressReview || s.progressNote!==note)) await updateStudent(studentId, { progressReview:true, progressNote:note }); }
  else if(s.progressNote){ await updateStudent(studentId, { progressReview:false, progressNote:'' }); }
}
async function markProgressReviewed(studentId){
  const st0 = byId(APP.students, studentId);
  await dbc('students').doc(studentId).update({ progressReview:false, progressNoteAck:(st0&&st0.progressNote)||'' });
  toast('Marked as reviewed');
}
function sessionCompletion(d){
  return { page20Clear: Number(d.toPage)===PAGES_PER_JUZ && d.result==='Clear', juz:d.juz };
}

async function addSession(studentId, date, data){
  const existing = APP.sessions.filter(s=>s.studentId===studentId && s.date===date);
  const sessionNo = existing.length + 1;
  validateSessionData(data);
  const stu = byId(APP.students, studentId);
  const hifz = !!stu && stu.studyType!=='Doura';
  if(hifz) await ensureProgressBase(studentId);          // must exist before the session is saved
  const createdAt = Date.now();
  const doc = Object.assign({ studentId: studentId, date: date, sessionNo: sessionNo }, data, { createdAt: createdAt });
  const ref = await dbc('sessions').add(doc);
  if(hifz) await recomputeHifzProgress(studentId, { id:ref.id, data:doc });
  else await adjustJuzProgress(studentId, pageCount(data.fromPage, data.toPage), data.type, sessionCompletion(data));
  return ref.id;
}
async function updateSessionDoc(id, data, oldData){
  validateSessionData(Object.assign({}, oldData||{}, data));
  await dbc('sessions').doc(id).update(data);
  if(oldData){
    const studentId = oldData.studentId;
    const stu = byId(APP.students, studentId);
    if(stu && stu.studyType!=='Doura'){
      await ensureProgressBase(studentId);
      await recomputeHifzProgress(studentId, { id:id, data:Object.assign({}, byId(APP.sessions,id)||{}, oldData, data) });
      return;
    }
    const oldPages = pageCount(oldData.fromPage, oldData.toPage);
    const newPages = pageCount(data.fromPage!==undefined?data.fromPage:oldData.fromPage, data.toPage!==undefined?data.toPage:oldData.toPage);
    const type = data.type || oldData.type;
    const merged = Object.assign({}, oldData, data);
    const wasClear = Number(oldData.toPage)===PAGES_PER_JUZ && oldData.result==='Clear';
    const comp = sessionCompletion(merged);
    await adjustJuzProgress(studentId, newPages-oldPages, type, wasClear && comp.page20Clear ? {page20Clear:false} : comp);
  }
}
async function deleteSessionDoc(id, sessData){
  const stu = sessData ? byId(APP.students, sessData.studentId) : null;
  if(stu && stu.studyType!=='Doura') await ensureProgressBase(sessData.studentId);
  await dbc('sessions').doc(id).delete();
  if(sessData){
    if(stu && stu.studyType!=='Doura') await recomputeHifzProgress(sessData.studentId, { id:id, data:null });
    else await adjustJuzProgress(sessData.studentId, -pageCount(sessData.fromPage, sessData.toPage), sessData.type);
  }
}

async function saveCompetitionMarksAndResults(compId, marks){
  await dbc('competitions').doc(compId).update({ marks: marks, marksEnteredAt: Date.now() });
  const comp = byId(APP.competitions, compId);
  const updatedComp = Object.assign({}, comp, { marks: marks });
  const results = computeCompetitionResults(updatedComp);
  for(let i=0;i<results.length;i++){
    const r = results[i];
    const starId = 'comp_'+compId+'_'+r.studentId;
    const stars = COMPETITION_STARS[r.rank];
    if(stars){
      await dbc('achievements').doc(starId).set({
        studentId: r.studentId, date: comp.date, stars: stars,
        reason: comp.type+' Competition — '+(r.rank===1?'1st Place':r.rank===2?'2nd Place':'3rd Place'),
        competitionId: compId, updatedAt: Date.now()
      });
    } else {
      await dbc('achievements').doc(starId).delete();
    }
  }
}

let PROGRESS_SYNCED = false;
// Brings every Hifz student's stored Current Juz in line with their latest New Learn session (writes only where different).
async function syncAllHifzProgress(){
  if(PROGRESS_SYNCED) return; PROGRESS_SYNCED = true;
  try{
    const list = APP.students.filter(function(st){ return st.studyType!=='Doura' && APP.sessions.some(function(x){ return x.studentId===st.id && newLearnValid(x); }); });
    for(let i=0;i<list.length;i++){
      const st = list[i], d = hifzCurrentDisplay(st.id);
      if(Number(st.currentJuzWhole)!==Number(d.whole) || (Number(st.currentJuzPages)||0)!==(Number(d.pages)||0)){
        await updateStudent(st.id, { currentJuzWhole:Number(d.whole), currentJuzPages:Number(d.pages)||0, hifzCompleted:false });
      }
    }
  }catch(e){ PROGRESS_SYNCED = false; }
}
function render(){
  validateStoredAuth();
  if(!PROGRESS_SYNCED && APP.auth && APP.auth.role!=='parent' && APP.students.length && APP.sessions.length){ syncAllHifzProgress(); }
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;

  if(!APP.auth){
    document.getElementById('header').innerHTML = '';
    document.getElementById('bottom-nav').innerHTML = '';
    document.getElementById('main-content').innerHTML = renderLoginScreen();
  } else {
    renderHeader();
    renderMain();
    renderNav();
    maybeRunMigrations();
  }

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ============================= TODAY ============================= */
function renderTodayView(){
  const date = APP.calendarTodayDate || APP.todayDate;
  const activeList = VS().filter(s=>s.active!==false);
  const q = (APP.studentSearch||'').toLowerCase().trim();
  const matched = activeList.filter(function(s){
    if(!q) return true;
    return (s.name||'').toLowerCase().indexOf(q)!==-1 || (s.batch||'').toLowerCase().indexOf(q)!==-1;
  });
  // Recorded students first, in the order their record was FIRST added (stored createdAt); pending students keep the name order.
  const recOf = function(s){ return byId(APP.dailyRecords, s.id+'_'+date); };
  const recorded = matched.filter(function(s){ return !!recOf(s); }).sort(function(a,b){
    const ra = recOf(a), rb = recOf(b);
    const ta = ra.createdAt || ra.updatedAt || 0, tb = rb.createdAt || rb.updatedAt || 0;
    if(ta!==tb) return ta-tb;
    return String(ra.id||'').localeCompare(String(rb.id||''));
  });
  const pendingList = matched.filter(function(s){ return !recOf(s); }).sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
  const list = recorded.concat(pendingList);

  const rows = list.map(function(s){
    const rec = byId(APP.dailyRecords, s.id+'_'+date);
    const done = !!rec;
    return '<div class="row-card" onclick="openDailyEntryModal(\''+s.id+'\',\''+date+'\')">'+

        '<div class="row-sub">'+esc(s.batch||'—')+(done? ' · '+esc(normStatus(rec.status))+' · '+esc(rec.performance)+'/10' : '')+'</div>'+
      '</div>'+
      '<div class="row-end">'+
        (done? statusBadge(rec.status) : '<span class="badge pending">Pending</span>')+
      '</div>'+
    '</div>';
  }).join('');

  return ''+
  '<div class="section-title">Today\'s Records</div>'+
  '<div class="field" style="margin-bottom:14px;">'+
    '<label>Date</label>'+
    '<input type="date" value="'+esc(date)+'" onchange="APP.calendarTodayDate=this.value;render();">'+
  '</div>'+
  (can('records') ? '<button class="btn small outline" style="margin-bottom:14px;" onclick="openEntriesManager(\''+esc(date)+'\')">'+iconSvg('star')+' Manage Stars &amp; Tallies</button>' : '')+
  '<div class="search-wrap">'+iconSvg('search')+
    '<input id="student-search-input" type="text" placeholder="Search students" value="'+esc(APP.studentSearch)+'" oninput="APP.studentSearch=this.value;render();">'+
  '</div>'+
  (list.length? '<div class="list">'+rows+'</div>' : '<div class="empty">'+iconSvg('today')+'<p>No active students match.</p></div>');
}

/* ============================= MANAGE STARS & TALLIES (by date) ============================= */
function entryKindInfo(kind){ return kind==='achievements' ? {field:'stars', noun:'star', coll:APP.achievements} : {field:'count', noun:'tally', coll:APP.tallies}; }
/* Only entries typed in by hand are ever listed or deletable. Competition stars and the tally generated from a day's
   status are system entries and are never offered here. Older tallies with no type were all added by hand. */
function isManualEntry(kind, e){
  if(!e) return false;
  if(kind==='achievements') return !(e.competitionId || String(e.id).indexOf('comp_')===0);
  return e.type!=='Automatic' && !/_auto$/.test(String(e.id));
}
function openEntriesManager(date, studentId){
  if(!can('records')){ toast('You do not have permission to manage entries'); return; }
  // openEntriesManager(date) from Today's Records = that day, everyone. openEntriesManager(null, id) from a profile = that student, any date.
  if(date!==undefined || studentId!==undefined){
    APP.entriesFilter = { date: date || '', studentId: studentId || '', allDates: !date };
  }
  const f = APP.entriesFilter = APP.entriesFilter || { date: APP.calendarTodayDate||APP.todayDate, studentId:'', allDates:false };
  const vs = VS(); const ids = vs.map(function(x){ return x.id; });
  const mk = function(kind){
    const info = entryKindInfo(kind);
    const list = info.coll.filter(function(e){
      return isManualEntry(kind,e) && ids.indexOf(e.studentId)!==-1 && (!f.studentId || e.studentId===f.studentId) && (f.allDates || e.date===f.date);
    }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0); });
    if(!list.length) return '<div class="subtle" style="margin-bottom:12px;">No manually added '+info.noun+' entries match.</div>';
    return list.map(function(e){
      const st = byId(APP.students, e.studentId);
      const qty = Number(e[info.field])||0;
      return '<div class="card" style="margin-bottom:8px;padding:12px;">'+
        '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">'+
          '<div style="min-width:0;"><div class="row-title">'+esc(st?st.name:'Unknown student')+'</div>'+
          '<div class="row-sub">'+(kind==='achievements'?'Star':'Tally')+' · '+fmtDateDisplay(e.date)+'</div></div>'+
          '<span class="badge '+(kind==='achievements'?'stars':'tallies')+'">'+(kind==='achievements'?'+'+qty+' ★':'+'+qty)+'</span>'+
        '</div>'+
        (e.reason?'<div class="subtle" style="margin-top:6px;">'+esc(e.reason)+'</div>':'')+
        '<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;">'+
          (qty>1 ? '<label class="subtle" style="display:flex;align-items:center;gap:6px;">Remove <input id="ent-qty-'+e.id+'" type="number" min="1" max="'+qty+'" step="1" value="'+qty+'" style="width:64px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:14px;"> of '+qty+'</label>' : '')+
          '<button class="btn small danger" onclick="confirmDeleteEntry(\''+kind+'\',\''+e.id+'\')">'+iconSvg('trash')+' Delete</button>'+
        '</div>'+
      '</div>';
    }).join('');
  };
  const opts = '<option value="">All students</option>'+vs.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); }).map(function(s){ return '<option value="'+s.id+'"'+(f.studentId===s.id?' selected':'')+'>'+esc(s.name)+'</option>'; }).join('');
  openModal(
    '<div class="modal-head"><div class="modal-title">Manage Stars &amp; Tallies<span class="sub">Manually added entries only</span></div>'+
    '<button class="modal-close" onclick="requestCloseModal()">'+iconSvg('close')+'</button></div>'+
    '<div class="field"><label>Student</label><select id="ent-student" onchange="APP.entriesFilter.studentId=this.value;openEntriesManager()">'+opts+'</select></div>'+
    '<div class="field"><label>Date</label><input id="ent-date" type="date" value="'+esc(f.date||'')+'" '+(f.allDates?'disabled ':'')+'onchange="APP.entriesFilter.date=this.value;openEntriesManager()"></div>'+
    '<label class="subtle" style="display:flex;align-items:center;gap:8px;margin:-4px 0 14px;"><input id="ent-all" type="checkbox" '+(f.allDates?'checked ':'')+'onchange="APP.entriesFilter.allDates=this.checked;if(!this.checked&&!APP.entriesFilter.date)APP.entriesFilter.date=APP.todayDate;openEntriesManager()"> Show all dates</label>'+
    '<div class="section-title small">Stars</div>'+mk('achievements')+
    '<div class="divider"></div>'+
    '<div class="section-title small">Tallies</div>'+mk('tallies')+
    '<div class="subtle" style="margin-top:10px;">Stars from competitions and tallies created automatically from a day\'s status are not listed and cannot be deleted here.</div>'+
    '<div class="modal-actions"><button class="btn outline" onclick="requestCloseModal()">Close</button></div>'
  );
}
function confirmDeleteEntry(kind, id){
  if(!can('records')){ toast('You do not have permission to delete entries'); return; }
  const info = entryKindInfo(kind);
  const e = byId(info.coll, id);
  if(!e || !isManualEntry(kind,e)){ toast('Only manually added entries can be deleted'); return; }
  const qty = Number(e[info.field])||0;
  const qEl = document.getElementById('ent-qty-'+id);
  let remove = (qEl && qEl.value!=='') ? Number(qEl.value) : qty;
  if(!Number.isInteger(remove) || remove<1 || remove>qty){ toast('Enter a quantity between 1 and '+qty); return; }
  const st = byId(APP.students, e.studentId);
  PENDING_CONFIRM = async function(){
    try{ await deleteEntry(kind, id, remove); toast(info.noun.charAt(0).toUpperCase()+info.noun.slice(1)+' entry updated'); }
    catch(err){ toast(err.message||'Could not delete'); }
    openEntriesManager();
  };
  openConfirmModal('Delete '+(info.noun==='star'?'Star':'Tally')+' Entry',
    'Remove '+remove+' '+info.noun+(remove===1?'':'s')+(remove<qty?' (of '+qty+')':'')+' for '+(st?st.name:'this student')+' dated '+fmtDateDisplay(e.date)+(e.reason?' ("'+e.reason+'")':'')+'? Other entries are not affected.',
    'Delete');
}
const ENTRY_BUSY = {};
async function deleteEntry(kind, id, removeQty){
  if(!can('records')) throw new Error('You do not have permission to delete entries');
  if(ENTRY_BUSY[id]) throw new Error('Already being deleted');
  ENTRY_BUSY[id] = true;
  try{
    const info = entryKindInfo(kind);
    const e = byId(info.coll, id);
    if(!e) throw new Error('Entry not found');
    if(VS().map(function(x){return x.id;}).indexOf(e.studentId)===-1) throw new Error('Entry not found');
    if(!isManualEntry(kind,e)) throw new Error('Only manually added entries can be deleted');
    const qty = Number(e[info.field])||0;
    const rm = (removeQty===undefined) ? qty : Number(removeQty);
    if(!Number.isInteger(rm) || rm<1 || rm>qty) throw new Error('Invalid quantity');
    const before = Object.assign({}, e);
    if(rm<qty){ const o={}; o[info.field]=qty-rm; o.updatedAt=Date.now(); await dbc(kind).doc(id).update(o); }
    else { await dbc(kind).doc(id).delete(); }
    try{
      await dbc('auditLog').add({ action:'delete-entry', kind:kind, entryId:id, studentId:e.studentId, entryDate:e.date, removedQuantity:rm, before:before, at:Date.now(), by:(APP.auth&&APP.auth.username)||'' });
    }catch(err){ console.error('audit log failed', err); }
  } finally { delete ENTRY_BUSY[id]; }
}

function yearlyReportTable(s, yearOverride){
  const year = yearOverride || APP.reportYear;
  let totals = {newLearnPages:0,oldRevisionPages:0,lastLearnPages:0,totalPages:0,points:0,perfStars:0,achStars:0,totalStars:0,starsUsed:0,starsRemaining:0,talliesGiven:0,talliesCancelled:0,talliesRemaining:0};
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let rows = '';
  for(let m=1;m<=12;m++){
    const mm = String(m).padStart(2,'0');
    const ym = year+'-'+mm;
    const st = computeStats(s.id, filterMonth(ym));
    rows += '<tr><td>'+monthNames[m-1]+'</td><td>'+st.newLearnPages+'</td><td>'+st.oldRevisionPages+'</td><td>'+st.lastLearnPages+'</td><td>'+st.totalPages+'</td>'+
      '<td>'+st.points+'</td><td>'+st.perfStars+'</td><td>'+st.achStars+'</td><td>'+st.totalStars+'</td>'+
      '<td>'+st.starsUsed+'</td><td>'+st.starsRemaining+'</td><td>'+st.talliesGiven+'</td><td>'+st.talliesCancelled+'</td><td>'+st.talliesRemaining+'</td></tr>';
    totals.newLearnPages+=st.newLearnPages; totals.oldRevisionPages+=st.oldRevisionPages; totals.lastLearnPages+=st.lastLearnPages; totals.totalPages+=st.totalPages;
    totals.points+=st.points; totals.talliesGiven+=st.talliesGiven;
  }
  // yearly totals for stars/tallies must be computed from the WHOLE year, not summed monthly star snapshots (each month resets floor grouping at 30) — use full-year filter directly.
  const yearStats = computeStats(s.id, filterYear(year));
  const yearComps = studentCompetitionHistory(s.id, filterYear(year));
  return ''+
  '<div class="card" style="margin-bottom:14px;"><b style="font-family:\'Plus Jakarta Sans\',sans-serif;font-size:16px;">'+esc(s.name)+'</b><div class="subtle">'+esc(s.batch||'—')+' · '+esc(year)+' yearly report</div></div>'+

    rows+
  '</table></div>'+
  '<div class="card">'+
    '<div class="section-title small">Year Totals ('+esc(year)+')</div>'+
    '<div class="kv"><span class="k">New Learn Pages</span><span class="v">'+totals.newLearnPages+'</span></div>'+
    '<div class="kv"><span class="k">Old Revision Pages</span><span class="v">'+totals.oldRevisionPages+'</span></div>'+
    '<div class="kv"><span class="k">Last Learn Pages</span><span class="v">'+totals.lastLearnPages+'</span></div>'+
    '<div class="kv"><span class="k">Total Pages</span><span class="v">'+totals.totalPages+'</span></div>'+
    '<div class="kv"><span class="k">Performance Points</span><span class="v">'+yearStats.points+'</span></div>'+
    '<div class="kv"><span class="k">Performance Stars</span><span class="v">'+yearStats.perfStars+'</span></div>'+
    '<div class="kv"><span class="k">Achievement Stars</span><span class="v">'+yearStats.achStars+'</span></div>'+
    '<div class="kv"><span class="k">Total Stars Earned</span><span class="v">'+yearStats.totalStars+'</span></div>'+
    '<div class="kv"><span class="k">Stars Used</span><span class="v">'+yearStats.starsUsed+'</span></div>'+
    '<div class="kv"><span class="k">Stars Remaining</span><span class="v">'+yearStats.starsRemaining+'</span></div>'+
    '<div class="kv"><span class="k">Tallies Given</span><span class="v">'+yearStats.talliesGiven+'</span></div>'+
    '<div class="kv"><span class="k">Tallies Cancelled</span><span class="v">'+yearStats.talliesCancelled+'</span></div>'+
    '<div class="kv"><span class="k">Tallies Remaining</span><span class="v">'+yearStats.talliesRemaining+'</span></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px;">'+
    '<div class="section-title small">Competitions This Year</div>'+
    (yearComps.length? yearComps.map(function(h){
      const rankLabel = h.result? (h.result.rank===1?'🥇 1st':h.result.rank===2?'🥈 2nd':h.result.rank===3?'🥉 3rd':h.result.rank+'th') : '—';
      return '<div class="kv"><span class="k">'+fmtDateDisplay(h.competition.date)+' — '+esc(h.competition.type)+'</span><span class="v">'+rankLabel+(h.stars?' · +'+h.stars+' ★':'')+'</span></div>';
    }).join('') : '<div class="subtle">No competitions this year.</div>')+
  '</div>';
}

function renderOverviewReport(){

    return true;
  }).sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });

  const rows = list.map(function(s){
    const st = computeStats(s.id, filterMonth(APP.overviewMonth));
    const comps = studentCompetitionHistory(s.id, filterMonth(APP.overviewMonth));

/* ============================= REQUESTS (admin) ============================= */
function renderRequestsView(){
  const list = VR().slice().sort(function(a,b){
    const order = {pending:0, approved:1, rejected:2};
    const oa = order[a.status]!==undefined?order[a.status]:3, ob = order[b.status]!==undefined?order[b.status]:3;
    if(oa!==ob) return oa-ob;
    return (b.createdAt||0)-(a.createdAt||0);
  });
  const pendingCount = list.filter(function(r){ return r.status==='pending'; }).length;

  const rows = list.map(function(r){
    const s = byId(APP.students, r.studentId);
    const name = s ? s.name : 'Unknown student';
    const statusBadge = r.status==='pending' ? '<span class="badge warn">pending</span>' : r.status==='approved' ? '<span class="badge success">approved</span>' : '<span class="badge inactive">rejected</span>';
    let detail = '';
    let approvedBox = '';
    let actions = '';
    if(r.type==='session'){
      detail = '📅 Session Request · Date: <b>'+fmtDateDisplay(r.date)+'</b> · Time: '+esc(r.time||'—');
      if(r.status==='approved'){
        approvedBox = '<div class="banner success" style="margin-top:8px;">Approved Session Time: <b>'+esc(r.approvedTime||r.time||'')+'</b></div>';
      }
      if(r.status==='pending'){
        actions = '<div class="field-row" style="margin-top:10px;">'+
          '<input type="text" id="rq-time-'+r.id+'" placeholder="Approve at (e.g. '+esc(r.time||'16:00')+')" value="'+esc(r.time||'')+'" style="flex:1;padding:9px 10px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;">'+
          '</div><div style="display:flex;gap:8px;margin-top:8px;">'+
          '<button class="btn small outline" onclick="rejectRequest(\''+r.id+'\',\'session\')">Reject</button>'+
          '<button class="btn small" onclick="approveSessionRequest(\''+r.id+'\')">Approve</button>'+
        '</div>';
      }
    } else {
      detail = '🏖️ Leave Request ('+esc(normStatus(r.reason))+') · Date: <b>'+fmtDateDisplay(r.date)+'</b>';
      if(r.status==='pending'){
        actions = '<div style="display:flex;gap:8px;margin-top:10px;">'+
          '<button class="btn small outline" onclick="rejectRequest(\''+r.id+'\',\'leave\')">Reject</button>'+
          '<button class="btn small" onclick="approveLeaveRequest(\''+r.id+'\')">Approve</button>'+
        '</div>';
      }
    }
    return '<div class="card" style="margin-bottom:12px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'+
        '<b style="font-size:15px;">'+esc(name)+'</b>'+
        statusBadge+
      '</div>'+
      '<div class="subtle" style="margin-top:6px;">'+detail+'</div>'+
      (r.note? '<div class="subtle" style="margin-top:4px;">Note: "'+esc(r.note)+'"</div>' : '')+
      approvedBox+
      actions+
    '</div>';
  }).join('');

  return ''+
  '<div style="margin-bottom:12px;"><button class="btn small outline" onclick="goBack()">← Back</button></div>'+
  '<div class="section-title">Notifications &amp; Requests</div>'+
  (pendingCount===0 ?
    '<div class="banner success" style="margin-bottom:18px;">All student session and leave requests are resolved!</div>' :
    '<div class="banner" style="margin-bottom:18px;">'+pendingCount+' request'+(pendingCount===1?'':'s')+' awaiting your response.</div>')+
  '<div class="section-title small">Request History ('+list.length+')</div>'+
  (list.length? rows : '<div class="empty">'+iconSvg('calendar')+'<p>No requests yet.</p></div>');
}
function approveSessionRequest(reqId){
  const input = document.getElementById('rq-time-'+reqId);
  const req = byId(APP.requests, reqId);
  const approvedTime = (input && input.value.trim()) || (req? req.time : '');
  resolveSessionRequest(reqId, 'approve', approvedTime).then(function(){ toast('Session request approved'); });
}
function rejectRequest(reqId, kind){
  if(kind==='session'){
    resolveSessionRequest(reqId, 'reject').then(function(){ toast('Request rejected'); });
  } else {
    resolveLeaveRequest(reqId, 'reject').then(function(){ toast('Request rejected'); });
  }
}
function approveLeaveRequest(reqId){
  resolveLeaveRequest(reqId, 'approve').then(function(){ toast('Leave approved — added to daily records'); });
}

/* ============================= COMPETITIONS (admin) ============================= */
function renderCompetitionsView(){
  const month = APP.competitionsMonth;
  const monthComps = APP.competitions.filter(function(c){ return (c.date||'').indexOf(month)===0; })
    .sort(function(a,b){ return a.date<b.date?1:-1; });
  const allComps = APP.competitions.slice().sort(function(a,b){ return a.date<b.date?1:-1; });

  function compRow(c){
    const results = computeCompetitionResults(c);
    const hasMarks = results.some(function(r){ return r.hasMarks; });
    const winner = hasMarks ? results.find(function(r){ return r.rank===1; }) : null;
    const winnerStudent = winner ? byId(APP.students, winner.studentId) : null;
    return '<div class="row-card" onclick="openCompetitionDetailModal(\''+c.id+'\')">'+
      '<div class="avatar">'+(c.type==='Qirath'?'Q':'H')+'</div>'+
      '<div class="row-main">'+
        '<div class="row-title">'+esc(c.type)+' Competition</div>'+
        '<div class="row-sub">'+fmtDateDisplay(c.date)+' · Juz '+esc(c.fromJuz)+'–'+esc(c.toJuz)+' · '+(c.competitorIds||[]).length+' competitors</div>'+
      '</div>'+
      '<div class="row-end">'+ (hasMarks? (winnerStudent? '<span class="badge done">🥇 '+esc(winnerStudent.name)+'</span>' : '<span class="badge done">Results in</span>') : '<span class="badge pending">Marks pending</span>') +'</div>'+
    '</div>';
  }

  return ''+
  '<div class="section-title">Competitions</div>'+
  '<button class="btn block" style="margin-bottom:16px;" onclick="openAddCompetitionModal()">'+iconSvg('plus')+' Add Competition</button>'+
  '<div class="field" style="margin-bottom:10px;"><label>Browse by month</label><input type="month" value="'+esc(month)+'" onchange="APP.competitionsMonth=this.value;render();"></div>'+
  '<div class="section-title small">'+fmtMonthDisplay(month)+'</div>'+
  (monthComps.length? '<div class="list" style="margin-bottom:20px;">'+monthComps.map(compRow).join('')+'</div>' : '<div class="subtle" style="margin-bottom:20px;">No competitions this month.</div>')+
  '<div class="divider"></div>'+
  '<div class="section-title small">All Past &amp; Upcoming Competitions</div>'+
  (allComps.length? '<div class="list">'+allComps.map(compRow).join('')+'</div>' : '<div class="empty">'+iconSvg('star')+'<p>No competitions yet.</p></div>');
}

    '</div>'+

      activeStudents.map(function(s){ return '<div class="chip-opt" data-id="'+s.id+'" onclick="this.classList.toggle(\'active\')">'+esc(s.name)+'</div>'; }).join('')+
