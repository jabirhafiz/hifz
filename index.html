async function submitAddCompetition(){
  const typeEl = document.querySelector('#ac-type button.active');
  const type = typeEl ? typeEl.getAttribute('data-val') : 'Hifz';
  const date = document.getElementById('ac-date').value || todayStr();
  const fromJuz = Number(document.getElementById('ac-from').value);
  const toJuz = Number(document.getElementById('ac-to').value);
  const competitorEls = document.querySelectorAll('#ac-competitors .chip-opt.active');
  const competitorIds = Array.prototype.map.call(competitorEls, function(el){ return el.getAttribute('data-id'); });
  if(competitorIds.length===0){ toast('Select at least one competitor'); return; }
  if(toJuz<fromJuz){ toast('"To Juz" must not be before "From Juz"'); return; }
  await addCompetition({ type:type, date:date, fromJuz:fromJuz, toJuz:toJuz, competitorIds:competitorIds });
  closeModal();
  toast('Competition saved');
}

function openCompetitionDetailModal(compId){
  const c = byId(APP.competitions, compId);
  if(!c) return;
  const cols = competitionColumns(c.type);
  const results = computeCompetitionResults(c);
  const hasMarks = results.some(function(r){ return r.hasMarks; });
  const medalFor = function(rank){ return rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':(rank+'.'); };

  const rows = results.map(function(r){
    const s = byId(APP.students, r.studentId);
    return '<tr><td>'+medalFor(r.rank)+' '+esc(s?s.name:'—')+'</td><td>'+r.m1+'</td><td>'+r.m2+'</td><td>'+r.m3+'</td><td><b>'+r.total+'</b></td><td>'+(COMPETITION_STARS[r.rank]?('+'+COMPETITION_STARS[r.rank]+' ★'):'—')+'</td></tr>';
  }).join('');

  openModal(
    '<div class="modal-head"><div class="modal-title">'+esc(c.type)+' Competition<span class="sub">'+fmtDateDisplay(c.date)+' · Juz '+esc(c.fromJuz)+'–'+esc(c.toJuz)+'</span></div>'+

    (hasMarks? (
      '<div class="section-title small">Results</div>'+
      '<div class="table-scroll" style="margin-bottom:14px;"><table><tr><th>Competitor</th><th>'+cols[0]+'</th><th>'+cols[1]+'</th><th>'+cols[2]+'</th><th>Total</th><th>Stars</th></tr>'+rows+'</table></div>'

    '<button class="btn" onclick="openCompetitionMarksModal(\''+compId+'\')">'+(hasMarks?'Edit Marks':'Enter Marks')+'</button></div>'

async function saveAdminLogin(){
  if(!requireAdmin()) return;
  const admin = APP.adminSettings; if(!admin){ return; }
  const u = document.getElementById('al-user').value.trim();
  const cur = document.getElementById('al-cur').value;
  const np = document.getElementById('al-new').value;
  const np2 = document.getElementById('al-new2').value;
  if(!u){ toast('Enter a username'); return; }
  if(!cur){ toast('Enter your current password to save changes'); return; }
  if(np && np.length<MIN_STAFF_PW){ toast('New password must be at least '+MIN_STAFF_PW+' characters'); return; }
  if(np && np!==np2){ toast('New passwords do not match'); return; }
  if(np==='thilawa'){ toast('Choose a password other than the default'); return; }
  if(u!==admin.username && usernameTaken(u, 'admin')){ toast('That username is already in use'); return; }
  let ok=false;
  try{ ok = await verifyPassword(cur, admin); }catch(e){ toast('Secure hashing unavailable'); return; }
  if(!ok){ toast('Current password is incorrect'); return; }
  if(!np && u===admin.username){ toast('Nothing to change'); return; }
  const rec = { username:u, hash:admin.hash, salt:admin.salt, iter:admin.iter, isDefault:admin.isDefault, updatedAt:Date.now() };
  if(np){ const h = await hashPassword(np); rec.hash=h.hash; rec.salt=h.salt; rec.iter=h.iter; rec.isDefault=false; }
  await dbc('settings').doc('admin').set(rec);
  APP.adminSettings = rec;
  APP.auth = { role:'admin', username:u, fp:credFp(rec) };
  saveAuthToStorage(APP.auth);
  toast('Admin login updated');
  render();
}

let TEACHER_SUBMITTING = false;
async function submitTeacherForm(id){
  if(!requireAdmin()) return;
  if(TEACHER_SUBMITTING) return;
  const name = document.getElementById('tf-name').value.trim();
  const username = document.getElementById('tf-user').value.trim();
  const pw = document.getElementById('tf-pass').value;
  const pw2 = document.getElementById('tf-pass2').value;
  if(!name){ toast('Enter the teacher\'s name'); return; }
  if(!username){ toast('Enter a username'); return; }
  if(/\s/.test(username)){ toast('Username cannot contain spaces'); return; }
  if(usernameTaken(username, 'teacher', id)){ toast('That username is already in use'); return; }
  if(!id && !pw){ toast('Set a password'); return; }
  if(pw && pw.length<MIN_STAFF_PW){ toast('Password must be at least '+MIN_STAFF_PW+' characters'); return; }
  if(pw && pw!==pw2){ toast('Passwords do not match'); return; }
  const permissions = {};
  TEACHER_PERMS.forEach(function(x){ const el=document.getElementById('tf-perm-'+x[0]); permissions[x[0]] = !!(el && el.checked); });
  const sc = document.querySelector('#tf-scope button.active');
  const scopeAll = !(sc && sc.getAttribute('data-val')==='assigned');
  const studentIds = scopeAll ? [] : Array.prototype.slice.call(document.querySelectorAll('.tf-stu')).filter(function(e){ return e.checked; }).map(function(e){ return e.value; });
  TEACHER_SUBMITTING = true;
  try{
    const data = { role:'teacher', name:name, username:username, permissions:permissions, scopeAll:scopeAll, studentIds:studentIds, updatedAt:Date.now() };
    if(pw){ const h = await hashPassword(pw); data.hash=h.hash; data.salt=h.salt; data.iter=h.iter; }
    if(id){
      await dbc('users').doc(id).update(data);
      toast('Teacher updated');
    } else {
      data.active = true; data.createdAt = Date.now();
      await dbc('users').add(data);
      toast('Teacher added');
    }
    closeModal();
  }catch(e){
    toast('Could not save: '+(e && e.message ? e.message : 'error'));
  } finally { TEACHER_SUBMITTING = false; }
}

async function secureLegacyPasswords(){
  if(!requireAdmin()) return;
  let n=0;
  const list = APP.students.filter(function(x){ return x.loginPassword && !x.loginHash; });
  for(let i=0;i<list.length;i++){
    const h = await hashPassword(list[i].loginPassword);
    await dbc('students').doc(list[i].id).update({ loginHash:h.hash, loginSalt:h.salt, loginIter:h.iter, loginPassword:'' });
    n++;
  }
  toast(n ? (n+' account'+(n===1?'':'s')+' secured') : 'Nothing to secure');
}

function handleRestoreFileSelected(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ toast('Could not read that file — make sure it is a valid backup JSON.'); return; }
    PENDING_CONFIRM = function(){ restoreBackupData(data); };
    openConfirmModal('Restore Backup', 'This will merge the backup file into your current data — matching records will be overwritten, nothing else is deleted.', 'Restore');
  };
  reader.readAsText(file);
}
async function restoreBackupData(data){
  if(!requireAdmin()) return;
  const collections = ['students','dailyRecords','sessions','achievements','tallies','requests','competitions','users','juzCompletions','auditLog'];
  for(let i=0;i<collections.length;i++){
    const name = collections[i];
    const arr = data[name];
    if(!Array.isArray(arr)) continue;
    for(let j=0;j<arr.length;j++){
      const rec = arr[j];
      if(!rec || !rec.id) continue;
      const copy = Object.assign({}, rec);
      delete copy.id;
      if(name==='users'){ copy.role = 'teacher'; if(!copy.hash || !copy.salt) continue; delete copy.password; }
      await dbc(name).doc(rec.id).set(copy);
    }
  }
  closeModal();
  toast('Backup restored');
}

/* ============================= CSV EXPORT ============================= */
function csvEscape(v){
  const s = String(v===undefined||v===null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
async function downloadCsv(filename, rows){
  const csv = rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\n');
  let handled = false;
  try{
    if(window.claude && window.claude.use){
      const downloads = await window.claude.use('downloads');
      if(downloads){
        await downloads.save({ filename: filename, data: csv });
        handled = true;
      }
    }
  }catch(e){ handled = false; }
  if(!handled){
    toast('Downloads not available in this view — use Print instead.');
  }
}

/* ============================= MODALS ============================= */
/* Modal closing. closeModal() always closes (used after a successful save). requestCloseModal() is for the user's own
   Close / Cancel / outside-tap / Esc / browser Back: if a form has unsaved typing it asks first and never saves anything. */
let MODAL_DIRTY = false, GUARD_NEXT = false;
let MODAL_STACK = [];
function closeModal(){ document.getElementById('modal-root').innerHTML=''; MODAL_DIRTY=false; GUARD_NEXT=false; MODAL_STACK=[]; }
/* Cancel / Close / Back: return to the form or page the user came from (if a form was opened from another form); otherwise close. */
function backModal(){
  const prev = MODAL_STACK.pop();
  if(!prev){ closeModal(); return; }
  document.getElementById('modal-root').innerHTML = prev;
  MODAL_DIRTY=false; GUARD_NEXT=false;
}
function modalTitleOf(html){
  const m = /class="modal-title">([^<]*)/.exec(html||''); return m ? m[1] : '';
}
function modalIsOpen(){ const r=document.getElementById('modal-root'); return !!(r && r.innerHTML); }
function requestCloseModal(){
  if(MODAL_DIRTY){ showDiscardPrompt(document.getElementById('modal-root')); return; }
  backModal();
}
function showDiscardPrompt(host){
  if(!host || document.getElementById('discard-box')) return;
  host.insertAdjacentHTML('beforeend',
    '<div id="discard-box" class="modal-overlay" style="z-index:300;" onclick="if(event.target===this) keepEditing();"><div class="modal-sheet">'+
      '<div class="modal-head"><div class="modal-title">Discard changes?<span class="sub">You have unsaved information. Nothing has been saved.</span></div></div>'+
      '<div class="modal-actions"><button class="btn outline" onclick="keepEditing()">Keep editing</button><button class="btn danger" onclick="discardChanges()">Discard</button></div>'+
    '</div></div>');
}
function keepEditing(){ const b=document.getElementById('discard-box'); if(b) b.remove(); }
function discardChanges(){ backModal(); }
/* nested sub-forms (session editor) that live in their own overlay */
function closeSubOverlay(el){
  const ov = el.closest('.modal-overlay');
  if(!ov) return;
  if(ov.getAttribute('data-dirty')==='1'){
    if(ov.querySelector('.sub-discard')) return;
    ov.querySelector('.modal-sheet').insertAdjacentHTML('beforeend','<div class="sub-discard banner" style="margin-top:14px;margin-bottom:0;"><b>Discard changes?</b> Nothing has been saved.<div class="modal-actions" style="margin-top:10px;"><button class="btn small outline" onclick="this.closest(\'.sub-discard\').remove()">Keep editing</button><button class="btn small danger" onclick="this.closest(\'.modal-overlay\').remove()">Discard</button></div></div>');
    return;
  }
  ov.remove();
}
function openModal(html){
  const guard = GUARD_NEXT; GUARD_NEXT = false; MODAL_DIRTY = false;
  const root = document.getElementById('modal-root');
  if(root.querySelector('.modal-overlay') && !document.getElementById('discard-box')){
    // a form opened on top of another one: remember the one underneath so Cancel returns to it
    const dbox = root.querySelector('#discard-box'); if(dbox) dbox.remove();
    if(modalTitleOf(root.innerHTML) !== modalTitleOf(html)) MODAL_STACK.push(root.innerHTML);
  }
  document.getElementById('modal-root').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) requestCloseModal();"><div class="modal-sheet" '+(guard?'oninput="MODAL_DIRTY=true" onchange="MODAL_DIRTY=true"':'')+'>'+html+'</div></div>';
}

let STUDENT_FORM_SUBMITTING = false;
async function submitStudentForm(studentId, btnEl){
  if(STUDENT_FORM_SUBMITTING) return;
  const name = document.getElementById('sf-name').value.trim();
  const batch = document.getElementById('sf-batch').value.trim();
  const joiningDate = document.getElementById('sf-join').value;
  const currentJuz = document.getElementById('sf-juz').value;
  const studyTypeEl = document.querySelector('#sf-studytype button.active');
  const studyType = studyTypeEl ? studyTypeEl.getAttribute('data-val') : 'Hifz';
  const juzIn = document.getElementById('sf-cjw').value;
  const pageIn = document.getElementById('sf-cjp').value;
  const luEl = document.getElementById('sf-login-user'), lpEl = document.getElementById('sf-login-pass');
  const loginUsername = luEl ? luEl.value.trim() : '';
  const loginPassword = lpEl ? lpEl.value : '';
  const existing = studentId ? byId(APP.students, studentId) : null;
  if(!name){ toast('Please enter a student name'); return; }
  if(!studentId && APP.students.some(function(x){ return (x.name||'').trim().toLowerCase()===name.toLowerCase(); })){
    toast('A student with this name already exists');
    return;
  }
  if(luEl && loginUsername && usernameTaken(loginUsername, 'student', studentId)){
    toast('That username is already in use');
    return;
  }
  const hadCred = !!(existing && (existing.loginHash || existing.loginPassword));
  if(luEl && loginUsername && !hadCred && !loginPassword){ toast('Set a password for this login'); return; }
  if(luEl && loginPassword && loginPassword.length<MIN_PARENT_PW){ toast('Password must be at least '+MIN_PARENT_PW+' characters'); return; }
  const jn = Number(juzIn), pn = Number(pageIn);
  if(!Number.isInteger(jn) || jn<1 || jn>MAX_JUZ){ toast('Current Juz must be between 1 and '+MAX_JUZ); return; }
  if(juzIn==='' || pageIn==='' || !Number.isInteger(pn) || pn<0 || pn>PAGES_PER_JUZ){ toast('Last Page Reached must be between 0 and '+PAGES_PER_JUZ); return; }
  if(currentJuz!=='' && (!Number.isInteger(Number(currentJuz)) || Number(currentJuz)<1 || Number(currentJuz)>MAX_JUZ)){ toast('Starting Juz must be between 1 and '+MAX_JUZ); return; }
  const storedPages = pn;
  STUDENT_FORM_SUBMITTING = true;
  if(btnEl){ btnEl.setAttribute('disabled','disabled'); }
  const data = { name: name, batch: batch, joiningDate: joiningDate, currentJuz: currentJuz, studyType: studyType };
  if(studyType==='Doura'){ data.douraJuzWhole = jn; data.douraJuzPages = storedPages; }
  else {
    data.currentJuzWhole = jn; data.currentJuzPages = storedPages;
    // a manual correction becomes the new starting point; only sessions saved from now on build on it
    const shown = existing ? hifzCurrentDisplay(existing.id) : null;
    if(existing && (Number(shown.whole)!==jn || (Number(shown.pages)||0)!==storedPages)){ data.progressBase = { w:jn, p:storedPages, at:Date.now(), manual:true }; data.progressReview = false; }
  }
  if(luEl){
    data.loginUsername = loginUsername;
    if(loginPassword){
      try{
        const h = await hashPassword(loginPassword);
        data.loginHash = h.hash; data.loginSalt = h.salt; data.loginIter = h.iter; data.loginPassword = '';
      }catch(e){ toast('Secure hashing unavailable — password not saved'); STUDENT_FORM_SUBMITTING=false; if(btnEl){ btnEl.removeAttribute('disabled'); } return; }
    }
  }
  const cdEl = document.getElementById('sf-cd');
  if(cdEl){ data.completedDouras = cdEl.value; }
  try{
    if(studentId){
      const yesBtn = document.getElementById('sf-active-yes');
      if(yesBtn){ data.active = yesBtn.getAttribute('data-val')==='1'; }
      await updateStudent(studentId, data);
      toast('Student updated');
    } else {
      await addStudent(data);
      toast('Student added');
    }
    closeModal();
  } finally {
    STUDENT_FORM_SUBMITTING = false;
  }
}

        '<div class="field"><label>Juz</label><input id="ss-juz" type="number" min="1" max="30" step="1" value="'+esc(sess?sess.juz:'')+'"></div>'+
      '</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>From Page</label><input id="ss-from" type="number" min="1" max="20" step="1" value="'+esc(sess?sess.fromPage:'')+'"></div>'+
        '<div class="field"><label>To Page</label><input id="ss-to" type="number" min="1" max="20" step="1" value="'+esc(sess?sess.toPage:'')+'"></div>'+
      '</div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Mistakes</label><input id="ss-mistakes" type="number" min="0" value="'+esc(sess?sess.mistakes:0)+'"></div>'+
        '<div class="field"><label>Result</label><select id="ss-result">'+ RESULT_OPTIONS.map(function(r){ return '<option value="'+r+'" '+(sess&&sess.result===r?'selected':'')+'>'+r+'</option>'; }).join('') +'</select></div>'+
      '</div>'+
      '<div class="field"><label>Remarks</label><textarea id="ss-remarks">'+esc(sess?sess.remarks:'')+'</textarea></div>'+
      '<div class="modal-actions">'+
        '<button class="btn outline" onclick="closeSubOverlay(this)">Cancel</button>'+
        '<button class="btn" onclick="submitSessionForm(\''+studentId+'\',\''+date+'\','+(editing?sessionIndex:'null')+',this)">Save Session</button>'+
      '</div>'+
    '</div>';
  modalRoot.appendChild(overlay);
}
let SESSION_SUBMITTING = false;
async function submitSessionForm(studentId, date, sessionIndex, btnEl){
  const overlay = btnEl.closest('.modal-overlay');
  const typeEl = overlay.querySelector('#ss-type .chip-opt.active');
  const type = typeEl ? typeEl.getAttribute('data-val') : 'New Learn';
  const juz = overlay.querySelector('#ss-juz').value;
  const fromPage = overlay.querySelector('#ss-from').value;
  const toPage = overlay.querySelector('#ss-to').value;
  const mistakes = overlay.querySelector('#ss-mistakes').value;
  const result = overlay.querySelector('#ss-result').value;
  const remarks = overlay.querySelector('#ss-remarks').value;
  const data = { type:type, juz:juz, fromPage:fromPage, toPage:toPage, mistakes:mistakes, result:result, remarks:remarks };
  try{ validateSessionData(data); }catch(e){ toast(e.message); return; }
  if(SESSION_SUBMITTING) return;
  SESSION_SUBMITTING = true;
  setTimeout(function(){ SESSION_SUBMITTING = false; }, 1500);   // ignore double-taps

  if(sessionIndex!==null && sessionIndex!==undefined){
    const existing = MODAL_SESSIONS[sessionIndex];
    const oldData = Object.assign({}, existing);
    Object.assign(existing, data);
    refreshModalSessionsList(studentId, date);
    overlay.remove();
    if(existing.id){ await updateSessionDoc(existing.id, data, oldData); }
  } else {
    const tempEntry = Object.assign({ sessionNo: MODAL_SESSIONS.length+1, studentId:studentId, date:date }, data);
    MODAL_SESSIONS.push(tempEntry);
    refreshModalSessionsList(studentId, date);
    overlay.remove();
    const newId = await addSession(studentId, date, data);
    tempEntry.id = newId;
  }
}

/* ---- Prevent duplicate submissions (double taps) ---- */
function once(fn){ let busy=false; return async function(){ if(busy) return; busy=true; try{ return await fn.apply(this, arguments); } finally{ busy=false; } }; }
submitAddCompetition = once(submitAddCompetition);
submitCompetitionMarks = once(submitCompetitionMarks);

submitParentSessionRequest = once(submitParentSessionRequest);
submitParentLeaveRequest = once(submitParentLeaveRequest);
submitStudentForm = once(submitStudentForm);
submitDailyEntry = once(submitDailyEntry);
submitSessionForm = once(submitSessionForm);
submitAchievement = once(submitAchievement);
submitTally = once(submitTally);

/* ---- Browser Back: views push history entries; Back closes an open form first, otherwise returns to the previous page ---- */
let HIST_DEPTH = 0;
function histState(){ return APP.auth && APP.auth.role==='parent' ? { pview:APP.pView } : { view:APP.view }; }
function histPush(){ try{ history.pushState(histState(), ''); HIST_DEPTH++; }catch(e){} }
function goBack(){ if(HIST_DEPTH>0){ try{ history.back(); return; }catch(e){} } if(APP.auth && APP.auth.role==='parent') goPView('p-dashboard'); else goView('dashboard'); }
function onPopState(ev){
  if(HIST_DEPTH>0) HIST_DEPTH--;
  if(!APP.auth) return;
  if(modalIsOpen()){
    // Back while a form is open: close/ask about the form, stay on the same page.
    try{ history.pushState(histState(), ''); HIST_DEPTH++; }catch(e){}
    requestCloseModal();
    return;
  }
  const st = (ev && ev.state) || {};
  if(APP.auth.role==='parent'){ APP.pView = st.pview || 'p-dashboard'; }
  else { let v = st.view || 'dashboard'; if(!viewAllowed(v) && v!=='login-settings') v='dashboard'; if(v==='login-settings' && !isAdmin()) v='dashboard'; APP.view = v; }
  render();
}
try{
  window.addEventListener('popstate', onPopState);
  window.addEventListener('keydown', function(e){ if(e.key==='Escape' && modalIsOpen()){ if(document.getElementById('discard-box')) keepEditing(); else requestCloseModal(); } });
}catch(e){}

/* ============================= INIT ============================= */
function loadTheme(){
  try{
    const t = localStorage.getItem('hifz_theme');
    if(t==='light' || t==='dark') return t;
  }catch(e){}
  return 'light';
}
function applyTheme(t){
  try{ document.documentElement.setAttribute('data-theme', t); }catch(e){}
}
function toggleTheme(){
  const cur = (function(){ try{ return document.documentElement.getAttribute('data-theme')||'light'; }catch(e){ return 'light'; } })();
  const next = cur==='light' ? 'dark' : 'light';
  applyTheme(next);
  try{ localStorage.setItem('hifz_theme', next); }catch(e){}
  render();
}
applyTheme(loadTheme());
initApp();
